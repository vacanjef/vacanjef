# TT-006: entorno completo de VacanJef en contenedores
# Uso: copie .env.example como .env y ejecute: docker compose up --build
# Web: http://localhost:8080   ·   SQL Server: localhost,14333 (usuario sa)
name: vacanjef

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${VACANJEF_SA_PASSWORD:?Defina VACANJEF_SA_PASSWORD en el archivo .env}
    ports:
      - "14333:1433"
    volumes:
      - datos-sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"SELECT 1\" -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  migraciones:
    build:
      context: .
      target: migraciones
    environment:
      VACANJEF_DB: "Server=sql;Database=VacanJefDB;User Id=sa;Password=${VACANJEF_SA_PASSWORD};TrustServerCertificate=True"
    depends_on:
      sql:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: web
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      VACANJEF_DB: "Server=sql;Database=VacanJefDB;User Id=sa;Password=${VACANJEF_SA_PASSWORD};TrustServerCertificate=True"
    ports:
      - "8080:8080"
    volumes:
      # HU-004: las fotos de mascotas sobreviven a la recreación del contenedor
      - fotos-mascotas:/datos/fotos-mascotas
    depends_on:
      migraciones:
        condition: service_completed_successfully

volumes:
  datos-sql:
  fotos-mascotas:
