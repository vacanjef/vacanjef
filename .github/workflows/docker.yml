name: Docker

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  construir:
    name: Construir imágenes Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Imagen de la web
        run: docker build --target web -t vacanjef-web:ci .
      - name: Imagen de migraciones
        run: docker build --target migraciones -t vacanjef-migraciones:ci .
