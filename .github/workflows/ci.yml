name: CI

on:
  push:
    branches: [main, dev, 'feature/**', 'fix/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, dev]

jobs:
  build-test:
    name: Compilar y probar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restaurar
        run: dotnet restore
      - name: Compilar
        run: dotnet build --no-restore -c Release
      - name: Pruebas con cobertura
        run: >
          dotnet test --no-build -c Release --verbosity normal
          --settings coverlet.runsettings
          --collect:"XPlat Code Coverage"
          --results-directory coverage
      - name: Reporte de cobertura
        if: success() || failure()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator -reports:"coverage/**/coverage.cobertura.xml" -targetdir:"coverage/reporte" -reporttypes:"HtmlInline;MarkdownSummaryGithub"
      - name: Resumen de cobertura
        if: success() || failure()
        run: cat coverage/reporte/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - name: Subir reporte de cobertura
        if: success() || failure()
        uses: actions/upload-artifact@v6
        with:
          name: reporte-cobertura
          path: coverage/reporte
          retention-days: 14
      - name: Dependencias vulnerables
        run: dotnet list package --vulnerable --include-transitive
