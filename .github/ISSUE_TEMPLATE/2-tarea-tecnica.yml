name: Tarea técnica
description: Trabajo técnico del Backlog (TT-###) o deuda técnica (DT-##)
title: "TT-0XX "
labels: ["tarea-tecnica"]
body:
  - type: input
    id: id
    attributes:
      label: ID de la tarea
      placeholder: TT-004 o DT-01
    validations:
      required: true
  - type: textarea
    id: objetivo
    attributes:
      label: Objetivo
      description: Qué se debe lograr y por qué.
    validations:
      required: true
  - type: input
    id: requisitos
    attributes:
      label: Requisitos relacionados
      placeholder: RNF-003, RNF-007
  - type: textarea
    id: criterios
    attributes:
      label: Criterios de terminado
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true
