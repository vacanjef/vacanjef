name: Defecto
description: Algo no funciona como dice el requisito (DEF-##)
title: "DEF: "
labels: ["defecto"]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: Qué pasa
      description: Describa el error.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: input
    id: requisito
    attributes:
      label: Requisito o caso de prueba afectado
      placeholder: RF-002 / CP-005
  - type: dropdown
    id: severidad
    attributes:
      label: Severidad
      options:
        - Bloqueante
        - Alta
        - Media
        - Baja
    validations:
      required: true
  - type: textarea
    id: evidencia
    attributes:
      label: Capturas o registros
      description: Arrastre capturas. No pegue contraseñas ni datos personales reales.
